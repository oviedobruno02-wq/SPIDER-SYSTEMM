plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spidersystem.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spidersystem.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
